appId: app.patchwright
productName: Patchwright
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!{src,tests,docs,.github}/**'
  - '!{electron.vite.config.ts,vite.web.config.ts,vitest.config.ts,electron-builder.yml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,*.tsbuildinfo}'
  - '!{.gitignore,README.md}'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
publish: null
